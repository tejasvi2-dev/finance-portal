<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Citizen Login - Access your Finance Department account, track applications, and manage services.">
  <title>Citizen Login | Finance Department of India</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/upgrade.css">
  <link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="login-wrapper">
    <div class="login-card reveal">
      <div class="login-logo">
        <i class="bi bi-bank2"></i>
        <span>Finance Department of India</span>
        <p class="login-subtitle mt-2">Citizen Services Portal</p>
      </div>
      <h2>Welcome Back</h2>
      <p class="login-subtitle">Sign in to access your citizen dashboard</p>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Username / Aadhaar / PAN</label>
          <div class="input-group">
            <span class="input-group-text" style="background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="loginUser" placeholder="Enter your username" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text" style="background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="loginPass" placeholder="Enter your password" required>
            <button class="btn" type="button" id="togglePass" style="background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary-custom w-100 mb-3">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
        <p style="text-align:center;color:rgba(255,255,255,0.4);font-size:.85rem;">
          Don't have an account? <a href="apply.html" class="text-gold">Register here</a>
        </p>
      </form>
    </div>
  </div>

  <!-- Success Modal -->
  <div class="modal fade" id="loginSuccessModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background:var(--navy);border:1px solid rgba(255,255,255,0.1);border-radius:20px;">
        <div class="modal-body success-modal-body">
          <div class="success-icon"><i class="bi bi-check-lg"></i></div>
          <h4 style="color:#fff;">Login Successful!</h4>
          <p style="color:rgba(255,255,255,0.6);">Welcome back to the Finance Department Portal. Redirecting to your dashboard...</p>
          <a href="index.html" class="btn btn-primary-custom mt-3"><i class="bi bi-house me-2"></i>Go to Homepage</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/script.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/upgrade.js"></script>
  <script src="js/search.js"></script>
  <script>
    $(document).ready(function(){
      // Toggle password visibility
      $('#togglePass').on('click',function(){
        var $p=$('#loginPass'), t=$p.attr('type')==='password'?'text':'password';
        $p.attr('type',t);
        $(this).find('i').toggleClass('bi-eye bi-eye-slash');
      });
      // Login form
      $('#loginForm').on('submit',function(e){
        e.preventDefault();
        var u=$('#loginUser').val().trim(), p=$('#loginPass').val().trim();
        if(u&&p){
          var $btn=$(this).find('button[type="submit"]');
          $btn.html('<span class="spinner-border spinner-border-sm me-2"></span>Signing in...').prop('disabled',true);
          setTimeout(function(){
            $btn.html('<i class="bi bi-check-circle me-2"></i>Success!');
            new bootstrap.Modal('#loginSuccessModal').show();
          },1500);
        }
      });
    });
  </script>
</body>
</html>
